---
interface_status:
  display_name: "Cisco NX-OS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same administrative and operational state"
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show interface | json"
      jmespath: "TABLE_interface.ROW_interface[].{name: interface, state: state, admin: admin_state}"