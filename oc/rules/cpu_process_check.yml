---
arista_eos_cpu_process_check:
  display_name: "Arista EOS CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
    params:
      mode: "is-ge"
      operator_data: 90
  collectors:
    - name: "textfsm"
      platform: "arista_eos"
      command: "show processes top once"
      jmespath: "[0:1].{cpu: {idle: to_number(global_cpu_percent_idle)}}"

cisco_nxos_cpu_process_check:
  display_name: "Cisco NX-OS CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
    params:
      mode: "is-ge"
      operator_data: 90
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show processes cpu | json"
      jmespath: "[@][*].{cpu: {idle: to_number(idle_percent)}}"

cisco_ios_cpu_process_check:
  display_name: "Cisco IOS CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
    params:
      mode: "is-le"
      operator_data: 10
  collectors:
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show processes cpu"
      jmespath: "[0:1].{cpu: {cpu_5m: to_number(cpu_5_min)}}"

cisco_ios_xe_cpu_process_check:
  display_name: "Cisco IOS-XE CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
    params:
      mode: "is-le"
      operator_data: 10
  collectors:
    - name: "textfsm"
      platform: "cisco_xe"
      command: "show processes cpu"
      jmespath: "[0:1].{cpu: {cpu_5m: to_number(cpu_usage_5_min)}}"

cisco_ios_xr_cpu_process_check:
  display_name: "Cisco IOS-XR CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
    params:
      mode: "is-le"
      operator_data: 10
  collectors:
    - name: "textfsm"
      platform: "cisco_xr"
      command: "show processes cpu"
      jmespath: "[0:1].{cpu: {cpu_5m: to_number(cpu_5_min)}}"
