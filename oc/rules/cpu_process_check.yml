---
arista_eos_cpu_process_check:
  display_name: "Arista EOS CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
      mode: "is-ge"
      operator_data: 90
  collectors:
    - name: "textfsm"
      platform: "arista_eos"
      command: "show processes top once"
      jmespath: "[0].{idle: global_cpu_percent_idle}"

cisco_nxos_cpu_process_check:
  display_name: "Cisco NX-OS CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
      mode: "is-ge"
      operator_data: 90
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show processes cpu | json"
      jmespath: "{idle: idle_percent}"

cisco_ios_cpu_process_check:
  display_name: "Cisco IOS CPU Process Check"
  rule_type: "operator"
  description: "CPU usage should be less than or equal to 10%."
  evaluate_args:
      mode: "is-le"
      operator_data: 10
  collectors:
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show processes cpu"
      jmespath: "[0].{cpu_5m: cpu_usage_5_min}"

cisco_ios_xe_cpu_process_check:
