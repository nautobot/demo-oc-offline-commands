---
arista_eos_cpu_process_check:
  display_name: "Arista EOS CPU Process Check"
  rule_type: "tolerance"
  description: "CPU utilization should not increase by more than 5%."
  evaluate_args:
    tolerance: 5
  collectors:
    - name: "textfsm"
      platform: "arista_eos"
      command: "show processes top once"
      jmespath: "[0].{user: global_cpu_user_percent, kernel: global_cpu_percent_system, idle: global_cpu_percent_idle}"

cisco_nxos_cpu_process_check:
  display_name: "Cisco NX-OS CPU Process Check"
  rule_type: "operator"
  description: "CPU utilization should not increase by more than 5%."
  evaluate_args:
      mode: "is-ge"
      operator_data: 90
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show processes cpu | json"
      jmespath: "{idle: idle_percent}"

cisco_ios_cpu_process_check:
  display_name: "Cisco IOS CPU Process Check"
  rule_type: "tolerance"
  description: "CPU utilization should not increase by more than 5%."
  evaluate_args:
    tolerance: 5
  collectors:
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show processes cpu"
      jmespath: "[0].{cpu_5s: cpu_usage_5_sec, cpu_1m: cpu_usage_1_min, cpu_5m: cpu_usage_5_min, interrupt_5s: cpu_interruption_5_sec}"
