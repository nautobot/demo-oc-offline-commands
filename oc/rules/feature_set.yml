---
feature_set_check:
  display_name: "Feature Set Check"
  rule_type: "exact_match"
  description: "Verify the set of enabled features is unchanged across the upgrade. Applies to Cisco NX-OS."
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show feature | json"
      jmespath: "TABLE_cfcFeatureCtrlTable.ROW_cfcFeatureCtrlTable[].{feature: feature_name, state: state} || `[]`"
