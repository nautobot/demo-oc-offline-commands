---
arp_table_check:
  display_name: "ARP Table Check"
  rule_type: "tolerance"
  description: "Verify the ARP entry count stays within a certain tolerance. Applies to Arista EOS, Cisco NX-OS, Cisco IOS and Juniper Junos."
  evaluate_args:
    tolerance: 10
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show ip arp | json"
      jmespath: "[{arp: {entries: length(ipV4Neighbors || `[]`)}}]"
    - name: "json"
      platform: "cisco_nxos"
      command: "show ip arp | json"
      jmespath: "[{arp: {entries: length(TABLE_vrf.ROW_vrf.TABLE_adj.ROW_adj || `[]`)}}]"
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show ip arp"
      jmespath: "[{arp: {entries: length(@)}}]"
    - name: "json"
      platform: "juniper_junos"
      command: "show arp no-resolve | display json"
      jmespath: '[{arp: {entries: to_number("arp-table-information"[0]."arp-entry-count"[0].data)}}]'
