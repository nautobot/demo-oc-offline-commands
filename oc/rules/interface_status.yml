---
arista_eos_interface_status:
  display_name: "Arista EOS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same administrative and operational state"
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show interfaces | json"
      jmespath: "interfaces.*.{name: name, status: interfaceStatus, lineProtocol: lineProtocolStatus}"

cisco_nxos_interface_status:
  display_name: "Cisco NX-OS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same administrative and operational state"
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show interface | json"
      jmespath: "TABLE_interface.ROW_interface[].{name: interface, state: state, admin: admin_state}"

cisco_ios_interface_status:
  display_name: "Cisco IOS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same administrative and operational state"
  collectors:
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show interfaces"
      jmespath: "[].{name: interface, state: link_status, admin: protocol_status}"
