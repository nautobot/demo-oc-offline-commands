---
arista_eos_interface_status:
  display_name: "Arista EOS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same operational state"
  collectors:
    - name: "textfsm"
      platform: "arista_eos"
      command: "show interfaces status"
      jmespath: "[].{name: interface, link: link_status, proto: protocol_status}"

cisco_nxos_interface_status:
  display_name: "Cisco NX-OS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same administrative and operational state"
  collectors:
    - name: "json"
      platform: "cisco_nxos"
      command: "show interface status | json"
      jmespath: "TABLE_interface.ROW_interface[].{name: interface, state: state}"

cisco_ios_interface_status:
  display_name: "Cisco IOS Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same administrative and operational state"
  collectors:
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show interfaces"
      jmespath: "[].{name: interface, state: link_status, admin: protocol_status}"

cisco_ios_xe_interface_status:
  display_name: "Cisco IOS-XE Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same operational state"
  collectors:
    - name: "textfsm"
      platform: "cisco_xe"
      command: "show interfaces status"
      jmespath: "[].{name: port, state: status}"

cisco_ios_xr_interface_status:
  display_name: "Cisco IOS-XR Interface Status Check"
  rule_type: "exact_match"
  description: "Verify all interfaces remain in the same operational state"
  collectors:
    - name: "textfsm"
      platform: "cisco_xr"
      command: "show interface brief"
      jmespath: "[].{name: interface, state: linep_state, admin: intf_state}"