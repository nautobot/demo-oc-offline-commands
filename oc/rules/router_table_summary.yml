---
router_table_summary:
  display_name: "Router Table Summary Check"
  rule_type: "tolerance"
  description: "Verify route counts by protocol stay within tolerance pre/post change. Applies to Arista EOS, Cisco NX-OS, Cisco IOS and Juniper Junos."
  evaluate_args:
    tolerance: 10
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show ip route summary | json"
      jmespath: "[vrfs.default.{total: totalRoutes, connected: connected, static: static, ospf: ospfCounts.ospfTotal, bgp: bgpCounts.bgpTotal, isis: isisCounts.isisTotal}]"
    - name: "json"
      platform: "cisco_nxos"
      command: "show ip route summary | json"
      jmespath: "TABLE_vrf.ROW_vrf.TABLE_addrf.ROW_addrf.TABLE_summary.ROW_summary || `[]`"
    - name: "textfsm"
      platform: "cisco_ios"
      command: "show ip route summary"
      jmespath: "[].{source: route_source, networks: to_number(networks), subnets: to_number(subnets)}"
    - name: "json"
      platform: "juniper_junos"
      command: "show route summary | display json"
      jmespath: '"route-summary-information"[0]."route-table" || `[]`'
