---
# Run by the solitaire-data Containerlab Config Deploy job around each deploy. The per-role
# count rules (Interface Up Count, LLDP Neighbor Count, OSPF Neighbor Count) are not listed:
# the job passes each role's own rules with its snapshot.
containerlab_pre_check:
  display_name: "Containerlab Pre-Check"
  description: "Checks before a containerlab deploy. The exact-match rules are only collected here, as the baseline the post-check compares against."
  validation_rules:
    - "CPU Idle Check"
    - "CPU Usage Check"
    - "OS Version Check (Containerlab)"
    - "OSPF Neighbor Count Zero"
    - "Interface Status Check"
    - "LLDP Neighbor Check"

containerlab_post_check:
  display_name: "Containerlab Post-Check"
  description: "Checks after a containerlab deploy, compared against the pre-check snapshot."
  validation_rules:
    - "CPU Idle Check"
    - "CPU Usage Check"
    - "Interface Status Check"
    - "LLDP Neighbor Check"
    - "OS Version Check (Containerlab)"
